services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://querymind:querymind@postgres:5432/querymind
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: querymind
      POSTGRES_PASSWORD: querymind
      POSTGRES_DB: querymind
    ports:
      - "5432:5432"
    volumes:
      - querymind-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  querymind-postgres:
